<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Expenses" />
  <title>ExpenseTracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>ExpenseTracker</h1>
      <div class="topbar-right">
        <a href="stats.html" class="iconbtn" title="Statistics" aria-label="Statistics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="4" width="3" height="14"/></svg>
          Stats
        </a>
        <button type="button" id="syncBtn" class="sync" title="Sync status" aria-live="polite">
          <span class="dot" id="syncDot"></span>
          <span id="syncText">Ready</span>
        </button>
      </div>
    </header>

    <form id="form" class="form" autocomplete="off">
      <!-- 0. Classification -->
      <div class="segment" role="radiogroup" aria-label="Whose expense">
        <input type="radio" name="klass" id="k-parents" value="parents" checked />
        <label for="k-parents">Parents</label>
        <input type="radio" name="klass" id="k-private" value="private" />
        <label for="k-private">Private</label>
      </div>

      <!-- 1. Date -->
      <section class="block">
        <div class="block-head">
          <span class="label">Date</span>
          <span class="date-display" id="dateDisplay">Today</span>
        </div>
        <div class="chips" id="dateChips">
          <button type="button" class="chip" data-days="0">Today</button>
          <button type="button" class="chip" data-days="-1">Yesterday</button>
          <button type="button" class="chip" data-days="-2">2 days ago</button>
          <label class="chip chip-cal" for="date">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            Pick
          </button>
          <input type="date" id="date" name="date" />
        </div>
      </section>

      <!-- 2. Description -->
      <section class="block">
        <div class="block-head">
          <span class="label">Description</span>
        </div>
        <div class="chips" id="descChips"></div>
        <input type="text" id="desc" name="desc" placeholder="Type or pick above…" list="descHistory" enterkeyhint="next" />
        <datalist id="descHistory"></datalist>
      </section>

      <!-- 3. Amount -->
      <section class="block">
        <div class="block-head">
          <span class="label">Amount</span>
        </div>
        <div class="amount">
          <span class="cur">€</span>
          <input type="text" id="amount" name="amount" inputmode="decimal" placeholder="0,00"
                 pattern="[0-9]*[.,]?[0-9]*" enterkeyhint="done" autocomplete="off" />
        </div>
      </section>

      <div class="spacer"></div>

      <button type="submit" id="submit" class="submit">Add expense</button>
    </form>

    <section class="recent" id="recentWrap" hidden>
      <div class="recent-head">
        <span class="label">Recent</span>
        <button type="button" id="clearRecent" class="link">clear list</button>
      </div>
      <ul id="recent"></ul>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
